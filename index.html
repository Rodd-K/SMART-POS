<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartPOS</title>
<!-- THE WHOLE USER INTERFACE IS THIS ONE FILE: the styles (colours and layout), then the script (what the buttons do). -->
<!-- The server (server.py) sends this file to the browser; nothing here needs installing. -->
<style>
/* STYLES. Colours are CSS variables (--bg, --ink, --panel, --acc ...). Change a variable in ONE place and the whole screen follows. */
*{box-sizing:border-box;margin:0}
body{font:15px/1.4 ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;min-height:100vh;color:var(--ink);background:var(--bg);transition:background .4s,color .4s}
/* Each screen has its own colour theme: login (gradient), pos = the cashier screen (light), adm = the admin screen (dark). To restyle a screen, edit its variables. */
body.login{--bg:linear-gradient(135deg,#4D6BFF,#9B5DE5 55%,#F15BB5);--ink:#1B1F3B;--panel:#fff;--mut:#6B7194;--acc:#4D6BFF;--line:#DCE2FF}
body.pos{--bg:#EEF2FF;--ink:#1B1F3B;--panel:#fff;--mut:#6B7194;--acc:#4D6BFF;--line:#DCE2FF}
body.adm{--bg:#0F1020;--ink:#ECEEFF;--panel:#1A1B33;--mut:#9094BF;--acc:#7C5CFF;--line:#2A2C4D}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:.6rem 1rem;background:var(--acc);color:#fff;font-weight:700;transition:transform .12s,filter .2s,opacity .2s}
button:hover{filter:brightness(1.12)}button:active{transform:scale(.95)}button:disabled{opacity:.4;cursor:not-allowed;filter:none}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}button.bad{background:#FF4D6D}
input,select{width:100%;padding:.6rem .8rem;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
:is(input,select,button):focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:1px}
.center{min-height:100vh;display:grid;place-items:center;padding:1rem}
.card{background:var(--panel);border-radius:22px;padding:2rem;width:min(380px,100%);box-shadow:0 20px 60px #0003;display:grid;gap:1rem}
.logo{font-size:1.4rem;font-weight:900;letter-spacing:-.02em}.logo span{color:var(--acc)}
.top{display:flex;align-items:center;gap:1rem;padding:.8rem 1.2rem;background:var(--panel);border-bottom:1.5px solid var(--line)}.top .logo{margin-right:auto}
.posgrid{display:grid;grid-template-columns:1fr 380px;gap:1.2rem;padding:1.2rem;align-items:start}
.bar{display:grid;gap:.7rem;margin-bottom:1rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);padding:.35rem .9rem;border-radius:99px}
.chip.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
/* Cashier product tiles. --c is the tile's colour, set by the script from the product's category. */
.tile{--c:#4D6BFF;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 70%,#000));text-align:left;display:grid;gap:.15rem;padding:1rem;min-height:118px;border-radius:18px;align-content:space-between;box-shadow:0 8px 18px color-mix(in srgb,var(--c) 35%,transparent)}
.tile small{opacity:.85;font-weight:600}.tile b{font-size:1.02rem}.tile span{font-size:1.15rem;font-weight:900}.tile i{font-style:normal;font-size:.8rem;opacity:.9}
.tile.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.07)}}
/* The cashier's cart panel (right side). */
.cart{background:var(--panel);border-radius:20px;padding:1.2rem;position:sticky;top:1rem;display:grid;gap:.8rem}
.lines{display:grid;gap:.5rem;max-height:34vh;overflow:auto}
.line{display:grid;grid-template-columns:1fr auto auto;gap:.6rem;align-items:center;padding:.5rem .6rem;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,var(--panel));border-left:5px solid var(--c);animation:in .25s}
@keyframes in{from{opacity:0;transform:translateX(12px)}}
.qty{display:flex;align-items:center;gap:.4rem}.qty button{padding:.15rem .55rem;background:var(--c)}
.total{display:flex;justify-content:space-between;font-size:1.5rem;font-weight:900}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}.seg button{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.quick{display:flex;gap:.4rem;flex-wrap:wrap}.quick button{padding:.3rem .7rem;font-size:.85rem}
.mut{color:var(--mut)}.empty{color:var(--mut);padding:1rem 0}
/* Pop-up dialogs: .ov is the dark backdrop, .modal is the white box. */
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:1rem;z-index:5;animation:fade .2s}@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);color:var(--ink);border-radius:20px;padding:1.5rem;width:min(440px,100%);max-height:92vh;overflow:auto;display:grid;gap:.9rem;animation:rise .25s}@keyframes rise{from{transform:translateY(20px);opacity:0}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.form label{display:grid;gap:.25rem;font-weight:600;font-size:.85rem}.form label:first-child{grid-column:1/-1}
.acts{display:flex;gap:.6rem;justify-content:flex-end}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;display:grid;gap:.3rem}.rc div{display:flex;justify-content:space-between;gap:1rem}
/* The small message that appears at the bottom (saved, error, ...). */
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:#1B1F3B;color:#fff;padding:.7rem 1.2rem;border-radius:12px;z-index:9;animation:rise .25s;border-left:5px solid #2EE6A6}.toast.err{border-color:#FF4D6D}
/* Admin screen layout: side menu on the left, content on the right. */
.adm .shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{background:#0A0B18;padding:1.2rem;display:flex;flex-direction:column;gap:.4rem;border-right:1.5px solid var(--line)}.side .logo{margin-bottom:1rem}
.side button{background:transparent;text-align:left;color:var(--mut)}.side button.on{background:var(--acc);color:#fff}.side .out{margin-top:auto}
.xrow{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 1rem;margin-bottom:.6rem;border:1.5px solid var(--line);border-radius:12px}.xrow p{margin:.2rem 0 0}
.main{padding:1.6rem;display:grid;gap:1.2rem;align-content:start;min-width:0}.main h2{font-size:1.5rem}
/* Admin dashboard boxes and panels. */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem}
.kpi{background:var(--panel);border-radius:16px;padding:1rem 1.2rem;border-left:5px solid var(--k)}.kpi b{display:block;font-size:1.6rem;color:var(--k)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.pnl{background:var(--panel);border-radius:16px;padding:1.2rem;display:grid;gap:.7rem;align-content:start;min-width:0}
.wk{display:flex;gap:.6rem;align-items:flex-end;height:170px}.wk div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.3rem}
.wk i{width:100%;border-radius:8px 8px 0 0;background:linear-gradient(#7C5CFF,#F15BB5);animation:grow .7s cubic-bezier(.2,.8,.2,1)}@keyframes grow{from{height:0}}
.hb{display:grid;gap:.2rem}.hb i{display:block;height:8px;border-radius:9px;background:#2EE6A6;animation:wide .7s}@keyframes wide{from{width:0}}
.tw{overflow:auto;background:var(--panel);border-radius:16px}table{border-collapse:collapse;width:100%}th,td{padding:.7rem 1rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600}tr:last-child td{border:0}
.pill{display:inline-block;padding:.15rem .7rem;border-radius:99px;background:color-mix(in srgb,var(--c) 25%,transparent);color:var(--c);font-weight:700;font-size:.82rem}
.row{display:flex;gap:.7rem;align-items:center}.row input{max-width:300px}
/* On small screens the cart moves below the products and the menu goes across the top. */
@media(max-width:900px){.posgrid{grid-template-columns:1fr}.cart{position:static}.adm .shell{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}.side .out{margin:0}}
/* Fraud tab: the red count on the menu, the alert cards and the risk cards. */
.badge{background:#FF4D6D;color:#fff;border-radius:99px;padding:0 .5rem;font-size:.72rem;margin-left:.5rem}.badge:empty{display:none}
.fa{background:var(--panel);border-radius:14px;padding:1rem 1.2rem;border-left:5px solid var(--k);display:grid;gap:.45rem;animation:in .25s}
.fa .top2{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.fa .meta{color:var(--mut);font-size:.82rem}
.risk{display:flex;gap:.7rem;flex-wrap:wrap}.rcard{background:var(--panel);border-radius:14px;padding:.8rem 1rem;border-top:4px solid var(--k);min-width:160px;display:grid;gap:.2rem}.rcard b{font-size:1.5rem;color:var(--k)}
textarea{width:100%;min-height:90px;padding:.6rem .8rem;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
button.sm{padding:.3rem .65rem;font-size:.82rem}
code{font-family:ui-monospace,Menlo,monospace;background:#0003;padding:.05rem .35rem;border-radius:6px;font-size:.85em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* When the browser prints (fallback when no receipt printer is set up), only the receipt is shown. */
@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;left:0;top:0;width:100%}.acts{display:none}}
</style></head><body><div id="app"></div>
<script>
// SCRIPT. Order: small helpers -> sign-in -> the cashier screen (pos) -> the admin screen (adm and its tabs in view()) -> start-up (the last line).
// $ is a shortcut for document.querySelector, so $('#q') finds the element with id="q".
const $=(s,r=document)=>r.querySelector(s),app=$('#app');
// esc() makes text safe to put into HTML, so a product name like <b> cannot break the page. ALWAYS wrap data that came from the server in esc().
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Formats a number as 'KES 1,200'.
const money=n=>'KES '+Number(n).toLocaleString('en-KE',{maximumFractionDigits:2});
// Category colours: a category's name is turned into a number that picks one colour from this list, so a category always keeps its colour. Edit PAL to change the palette.
const PAL=['#FF5D73','#FF9F1C','#17B890','#4D96FF','#9B5DE5','#F15BB5','#00A6A6','#E8B100'];
const col=c=>PAL[[...String(c)].reduce((a,x)=>(a*31+x.charCodeAt(0))>>>0,7)%PAL.length];
// The page's memory.  T = the sign-in token (kept in the browser so a refresh does not sign you out)   ME = who is signed in
// P = the products   cart = the current sale as {productId: quantity}   ref = a unique id for the current sale (prevents double charging)
let T=localStorage.getItem('spos'),ME,P=[],cart={},cat='All',method='cash',ref=crypto.randomUUID(),tab='over';

// api() is the ONE way the page talks to the server. api('products') asks for data; api('sales','POST',{...}) sends data. It adds the token, turns errors into messages, and signs you out if the token is no longer valid.
async function api(p,m='GET',b){
 const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));
 if(r.status===401&&p!=='login'){localStorage.removeItem('spos');T=null;loginView()}
 if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
// Shows a small message at the bottom of the screen (err=true makes it red).
function toast(t,err){document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast'+(err?' err':'');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}
// Shows a pop-up dialog with the given HTML.
function modal(h){closeModal();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="modal">${h}</div>`;o.onclick=e=>{if(e.target==o)closeModal()};document.body.append(o)}
// Closes the dialog and puts the cursor back in the search box so the next barcode scan works.
const closeModal=()=>{$('#ov')?.remove();$('#q')?.focus()};
// Signs out: tells the server, forgets the token, shows the login screen.
async function logout(){try{await api('logout','POST')}catch{}localStorage.removeItem('spos');T=null;loginView()}

// The sign-in screen.
function loginView(){
 document.body.className='login';
 app.innerHTML=`<div class=center><form class=card id=f><div class=logo>Smart<span>POS</span></div><p id=bn class=mut style="margin:0;font-weight:700"></p><p class=mut>Sign in to start your shift. Forgotten your password? Ask your admin.</p>
 <input name=u placeholder="Username" autocomplete=username autofocus required><input name=p type=password placeholder="Password" autocomplete=current-password required><button>Sign in</button></form></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const f=e.target;
  try{const r=await api('login','POST',{username:f.u.value,password:f.p.value});T=r.token;localStorage.setItem('spos',T);ME=r.user;route()}
  catch(x){toast(x.message,1)}}
 api('setup/status').then(s=>{if(s.needed)setupView();else if(s.business&&$('#bn'))$('#bn').textContent=s.business}).catch(()=>{})}

// After sign-in: admins go to the admin screen, cashiers to the cashier screen. To add a role, change it here.
async function route(){if(ME.must_change)return pwForm(true);ME.role=='admin'?adm():pos()}

/* ---------- Cashier ---------- */
// THE CASHIER SCREEN. Builds the page, loads the products, and connects the search box, tiles, cart buttons and the Charge button.
// netCheck(): every 15 seconds ask the server whether we are online (can reach Safaricom). Shows "Online" or "No internet" in the top bar.
// With no internet the M-Pesa button is switched off and the cashier is told to take cash: cash sales never need the internet.
let NET=true,netT,FORCE=false;
// effOff(): are we working OFFLINE? True when the system cannot reach Safaricom, or when the cashier pressed the Online/Offline button to say so.
const effOff=()=>FORCE||(!NET&&ME.mode!='simulated');
async function netCheck(){
 if(document.body.className!='pos')return;
 try{NET=(await api('health')).online}catch(x){NET=false}
 netView()}
// netView(): makes the Online/Offline button and the M-Pesa panel match the situation.
function netView(){
 const off=effOff(),e=$('#net');
 if(e){e.textContent=off?'Offline':'Online';e.style.setProperty('--c',off?'#E8A200':'#17B890');
  e.title=off?(FORCE?'You set the system to Offline. Press to go back Online.':'No internet detected.'):'Press to work Offline, for example if the customer phone cannot receive an M-Pesa prompt.'}
 if($('#netmsg'))$('#netmsg').style.display=off&&method=='mpesa'?'':'none';
 upd()}
// toggleOffline(): the Online/Offline button in the top bar. When the system itself has no internet it is Offline whatever you press.
function toggleOffline(){
 if(!NET&&ME.mode!='simulated')return toast('No internet detected. The system stays Offline until the connection returns.',1);
 FORCE=!FORCE;netView()}
async function pos(){
 document.body.className='pos';cart={};cat='All';method='cash';FORCE=false;
 app.innerHTML=`<header class=top><b class=logo>Smart<span>POS</span></b><button id=net class=pill onclick=toggleOffline() style="--c:#17B890">Online</button><span class=mut>${esc(ME.name)}</span><button class=ghost onclick=pwForm(false)>Password</button><button class=ghost onclick=logout()>Sign out</button></header>
 <main class=posgrid><section><div class=bar><input id=q placeholder="Search products or scan a barcode" autofocus><div id=chips class=chips></div></div><div id=grid class=grid></div></section>
 <aside class=cart><h3>Current sale</h3><div id=lines class=lines></div><div class=total><span>Total</span><span id=tot></span></div>
 <div class=seg><button data-m=cash class=on>Cash</button><button data-m=mpesa>M-Pesa${ME.mode=='simulated'?' (simulated)':''}</button></div>
 <p id=netmsg class=mut style="display:none;margin:0">Offline: an M-Pesa prompt cannot be sent. Ask the customer to show their M-Pesa message, check it, and use Checkout. Or take cash.</p><div id=phonebox style="display:none"><input id=phone inputmode=tel placeholder="Customer phone, e.g. 0712345678"></div><div id=manualbox style="display:none;gap:.5rem"><input id=mcode placeholder="M-Pesa code from the message, e.g. SKL4X5Y6Z7" maxlength=10 autocapitalize=characters autocomplete=off><input id=mamt inputmode=decimal placeholder="Amount in the message (KES)"></div><div id=cashbox><input id=tend inputmode=decimal placeholder="Cash received"><div class=quick id=quick></div><p id=chg class=mut></p></div>
 <button id=pay disabled>Charge</button><button id=manual class=ghost style="display:none" disabled>Checkout</button></aside></main>`;
 P=await api('products');chips();grid();lines();netCheck();clearInterval(netT);netT=setInterval(netCheck,15000);
 $('#q').oninput=grid;
 $('#q').onkeydown=e=>{if(e.key=='Enter'){const v=e.target.value.trim(),b=v&&P.find(p=>p.barcode&&p.barcode==v);if(b){add(b.id);beep();e.target.value='';grid()}else if(/^\d{6,}$/.test(v)){toast('No product has the barcode '+v,1);beep(true);e.target.value='';grid()}}};
 $('#grid').onclick=e=>{const t=e.target.closest('.tile');if(t){add(t.dataset.id);t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop')}};
 $('#chips').onclick=e=>{const c=e.target.closest('.chip');if(c){cat=c.dataset.c;chips();grid()}};
 $('#lines').onclick=e=>{const b=e.target.closest('[data-d]');if(b){chg(b.dataset.id,+b.dataset.d)}};
 $('.seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;method=b.dataset.m;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x==b));upd()};
 $('#tend').oninput=upd;$('#phone').oninput=upd;$('#pay').onclick=charge;$('#mcode').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');upd()};$('#mamt').oninput=upd;$('#manual').onclick=manualCheckout;
 $('#quick').onclick=e=>{if(e.target.dataset.v){$('#tend').value=e.target.dataset.v;upd()}}}
// The category buttons above the products.
function chips(){const cs=['All',...new Set(P.map(p=>p.category))];$('#chips').innerHTML=cs.map(c=>`<button class="chip ${c==cat?'on':''}" style="--c:${c=='All'?'#1B1F3B':col(c)}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
// The product tiles, filtered by the search text and the chosen category.
function grid(){const t=$('#q').value.trim().toLowerCase();
 $('#grid').innerHTML=P.filter(p=>(cat=='All'||p.category==cat)&&(p.name.toLowerCase().includes(t)||(t&&p.barcode==t))).map(p=>`<button class=tile style="--c:${col(p.category)}" data-id="${p.id}" ${+p.stock<1?'disabled':''}><small>${esc(p.category)}</small><b>${esc(p.name)}</b><span>${money(p.price)}</span><i>${+p.stock<1?'Sold out':p.stock+' left'}</i></button>`).join('')||'<p class=empty>No products match. Try another search or category.</p>'}
// Adds one of a product to the cart (never more than is in stock).
function add(id){const p=P.find(x=>x.id==id);if(!p)return;if((cart[id]||0)>=+p.stock)return toast(`Only ${p.stock} of ${p.name} in stock`,1);cart[id]=(cart[id]||0)+1;lines()}
// The + and - buttons in the cart.
function chg(id,d){const p=P.find(x=>x.id==id);const n=(cart[id]||0)+d;if(n<1)delete cart[id];else if(n<=+p.stock)cart[id]=n;else toast(`Only ${p.stock} in stock`,1);lines()}
// The cart total (for display only: the SERVER recalculates it from its own prices).
const sum=()=>Object.entries(cart).reduce((a,[id,n])=>a+n*+P.find(p=>p.id==id).price,0);
// Draws the cart lines and the quick-cash buttons.
function lines(){
 const e=Object.entries(cart);
 $('#lines').innerHTML=e.map(([id,n])=>{const p=P.find(x=>x.id==id);return`<div class=line style="--c:${col(p.category)}"><div><b>${esc(p.name)}</b><div class=mut>${money(p.price)}</div></div><div class=qty><button data-id="${id}" data-d=-1 aria-label="Remove one">−</button><b>${n}</b><button data-id="${id}" data-d=1 aria-label="Add one">+</button></div><b>${money(n*p.price)}</b></div>`}).join('')||'<p class=empty>Tap a product to start a sale.</p>';
 const t=sum();$('#quick').innerHTML=t?[`<button class=ghost data-v="${t}">Exact</button>`,...[100,200,500,1000,2000].filter(v=>v>=t).slice(0,3).map(v=>`<button class=ghost data-v="${v}">${v}</button>`)].join(''):'';upd()}
// Updates the total, the change due, and whether the Charge button is enabled.
function upd(){
 const t=sum(),m=method=='mpesa',v=+$('#tend').value||0,off=effOff(),live=m&&ME.mode!='simulated';
 $('#tot').textContent=money(t);$('#cashbox').style.display=m?'none':'';
 $('#phonebox').style.display=m&&(live||off)?'':'none';$('#manualbox').style.display=m&&off?'grid':'none';
 $('#chg').textContent=!t?'':v>=t?`Change: ${money(v-t)}`:v?`Short by ${money(t-v)}`:'';
 // Online: the main button sends a prompt to the customer's phone (Safaricom confirms the payment). Offline: that button is off and Checkout is used instead.
 $('#pay').disabled=!t||(!m&&v<t)||(m&&off)||(live&&$('#phone').value.replace(/\D/g,'').length<9);
 $('#pay').textContent=m?(live||off?'Send M-Pesa prompt':'Charge M-Pesa (simulated)'):'Charge cash';
 const mb=$('#manual');mb.style.display=m&&off?'':'none';
 mb.disabled=!t||!/^[A-Z0-9]{10}$/.test($('#mcode').value)||Math.round((+$('#mamt').value)*100)!=Math.round(t*100)}
// Pressed on Charge: sends the sale to the server. M-Pesa sales go to mpesaPay() instead. A new ref is made after a successful sale.
async function charge(){
 if(method=='mpesa'&&ME.mode!='simulated')return mpesaPay();
 const b=$('#pay');b.disabled=true;
 try{const r=await api('sales','POST',{client_ref:ref,method,tendered:$('#tend').value,items:Object.entries(cart).map(([product_id,qty])=>({product_id,qty}))});
  ref=crypto.randomUUID();cart={};$('#tend').value='';P=await api('products');grid();lines();receipt(r)}
 catch(x){toast(x.message,1);upd()}}
// manualCheckout(): the Checkout button, used when there is no internet. The cashier has looked at the customer's M-Pesa message and typed
// its code and amount. The server records the sale as "to be verified"; a manager later compares it with the M-Pesa statement.
async function manualCheckout(){
 const b=$('#manual');b.disabled=true;

// M-Pesa sale: asks the server to send the prompt, then checks every 3 seconds whether the customer has paid. The sale is only recorded by the server once Safaricom confirms.
async function mpesaPay(){
 $('#pay').disabled=true;let stop=0;const myref=ref,phone=$('#phone').value;
 try{await api('mpesa/start','POST',{client_ref:myref,phone,items:Object.entries(cart).map(([product_id,qty])=>({product_id,qty}))})}

 modal(`<h3>Waiting for the customer</h3><p>A payment prompt was sent to ${esc(phone)}. Ask the customer to enter their M-Pesa PIN.</p><div class=acts><button class=ghost id=stp>Stop waiting</button></div>`);
 $('#stp').onclick=()=>{stop=1;closeModal();ref=crypto.randomUUID();toast('Stopped waiting. If the customer still pays, the sale will appear under Sales.',1);upd()};
 const why={cancelled:'The customer cancelled the payment',failed:'The payment failed',timeout:'No response from the customer',paid_review:'Payment received but stock changed. Ask the admin to review'};
 while(!stop){await new Promise(r=>setTimeout(r,3000));if(stop)break;
  try{const s=await api('mpesa/status/'+myref);
   if(s.status=='paid'){stop=1;ref=crypto.randomUUID();cart={};P=await api('products');grid();lines();receipt(s.sale);break}
   if(s.status!='pending'){stop=1;closeModal();ref=crypto.randomUUID();toast(why[s.status]||s.result_desc,1);upd()}}catch(x){}}}

// The date shortcuts on the Export tab (Today, This week, This month, ...). The week starts on Monday.
function preset(k){
 const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());let f=t,e=t;
 if(k=='week'){f=new Date(t);f.setDate(t.getDate()-((t.getDay()+6)%7))}  /* the week starts on Monday */
 else if(k=='month')f=new Date(t.getFullYear(),t.getMonth(),1);
 else if(k=='last'){f=new Date(t.getFullYear(),t.getMonth()-1,1);e=new Date(t.getFullYear(),t.getMonth(),0)}
 else if(k=='30'){f=new Date(t);f.setDate(t.getDate()-29)}
 else if(k=='clear'){$('#xf').value='';$('#xt').value='';return}
 $('#xf').value=iso(f);$('#xt').value=iso(e)}

 if(tab=='mpesa'){const s=await api('mpesa'),mp=await api('mpesa/manual');m.innerHTML=`<h2>M-Pesa payments</h2>`+tbl(['Time','Phone','Amount','Status','Receipt','Note'],s.map(x=>[esc(x.created_at.replace('T',' ')),esc(x.phone),money(x.amount),`<span class=pill style="--c:${x.status=='paid'?'#2EE6A6':x.status=='pending'?'#FFB020':'#FF4D6D'}">${esc(x.status)}</span>`,esc(x.receipt),esc(x.result_desc)]),'No M-Pesa payments yet.')+
  `<h3>Confirmed by the cashier (no internet)</h3><p class=empty style="text-align:left;padding:0">When there was no internet, the cashier checked the customer's M-Pesa message by eye. Compare each code with your M-Pesa statement, then mark it Verified or Disputed.</p>`+
  tbl(['Time','Cashier and receipt','Code and phone','Amount','Taken','Status','Check'],mp.map(x=>[esc(x.created_at.slice(5,16).replace('T',' ')),`${esc(x.cashier)}<br><span class=mut>${esc(x.receipt_no)}</span>`,`<b>${esc(x.code)}</b>${x.phone?`<br><span class=mut>${esc(x.phone)}</span>`:''}`,money(x.amount),x.online_when_taken?'<span class=pill style="--c:#FF4D6D">while online</span>':'offline',`<span class=pill style="--c:${x.status=='verified'?'#2EE6A6':x.status=='disputed'?'#FF4D6D':'#FFB020'}">${x.status}</span>${x.checked_by?`<br><span class=mut>${esc(x.checked_by)}</span>`:''}`,
   x.status=='verified'?'':`<button class="ghost sm" data-mr=verified data-id=${x.id}>Verified</button> <button class="ghost sm" data-mr=disputed data-id=${x.id}>Disputed</button>`]),'No manual payments yet.');
  m.onclick=async e=>{const b=e.target.closest('[data-mr]');if(!b)return;const id=b.dataset.id;
   const save=async(st,note)=>{try{await api('mpesa/manual/'+id+'/review','POST',{status:st,note});closeModal();toast(st=='verified'?'Marked as verified':'Marked as disputed');view()}catch(x){toast(x.message,1)}};
   if(b.dataset.mr=='verified')return save('verified','');
   modal(`<h3>Dispute this payment</h3><p class=mut>It does not appear on the M-Pesa statement, or the amount differs.</p><label class=mut style="display:grid;gap:.3rem">What did you find?<textarea id=dn maxlength=300></textarea></label><div class=acts><button class=ghost onclick=closeModal()>Cancel</button><button id=dk>Save</button></div>`);
   $('#dk').onclick=()=>save('disputed',$('#dn').value)}}
 if(tab=='export'){const b=(n,l,d)=>`<div class=xrow><div><b>${l}</b><p class=empty style="padding:0;text-align:left">${d}</p></div><button onclick="dl('${n}')">Download</button></div>`;
 m.innerHTML=`<h2>Export data</h2><p class=empty style="text-align:left;padding:0 0 1rem">Files open in Excel. Pick dates to limit the records (leave blank for everything). Products are always exported in full.</p>
 <div class=xrow><div><b>Date range</b></div><div style="display:flex;gap:.5rem;align-items:center">From <input type=date id=xf> To <input type=date id=xt></div></div><div class=chips id=xp style="margin-bottom:.8rem">${[['today','Today'],['week','This week'],['month','This month'],['last','Last month'],['30','Last 30 days'],['clear','Clear dates']].map(([k,l])=>`<button class=chip data-p=${k}>${l}</button>`).join('')}</div>`
 +b('sales','Sales','One row per sale: receipt, cashier, payment method, total.')+b('sale_items','Sale items','One row per product sold, with cost and profit.')
 +b('products','Products and stock','Current prices, costs and stock levels.')+b('movements','Stock log','Every stock change, with reason and who made it.')
 +b('mpesa','M-Pesa payments','Every payment attempt and its result.')+b('audit','Audit log','Sign-ins, sales, edits and exports.')+b('mpesa_manual','Manual M-Pesa confirmations','Payments the cashier confirmed by hand when there was no internet, with their status, to compare with your M-Pesa statement.')+b('fraud','Fraud report','Every fraud finding in the chosen dates (by when the activity happened): person, rule, score, reason and the manager decision.')+b('fraud_summary','Fraud summary by person','One row per person: number of findings, risk score and level, and how many were cleared or confirmed.')
 +b('all','Everything (ZIP)','All of the above as one ZIP file.');$('#xp').onclick=e=>{const k=e.target.dataset.p;if(k)preset(k)}}
 // Stock log tab: every stock change.
 if(tab=='log'){const s=await api('movements');m.innerHTML=`<h2>Stock log</h2>`+tbl(['Time','Product','Type','Change','Stock after','Reason','By'],s.map(x=>[esc(x.created_at.replace('T',' ')),esc(x.product_name),`<span class=pill style="--c:${col(x.type)}">${esc(x.type)}</span>`,`<b style="color:${+x.qty_change<0?'#FF6B81':'#2EE6A6'}">${x.qty_change>0?'+':''}${esc(x.qty_change)}</b>`,esc(x.stock_after),esc(x.reason),esc(x.user_name)]),'No stock movements yet.')}
 }catch(x){toast(x.message,1)}}
// Builds a simple table from column headings and rows (used by several tabs).
const tbl=(h,r,e)=>r.length?`<div class=tw><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`:`<p class=empty>${e}</p>`;
// The Stock tab: the product table with search, Add, Edit and Delete.
function stockView(){
 const t=($('#sq')?.value||'').toLowerCase(),rows=P.filter(p=>p.name.toLowerCase().includes(t)||p.category.toLowerCase().includes(t));
 $('#main').innerHTML=`<h2>Stock</h2><div class=row><input id=sq placeholder="Search stock" value="${esc(t)}"><button onclick="prodForm()" style="margin-left:auto">Add product</button></div>`+
 tbl(['Product','Category','Price','Cost','In stock','',''],rows.map(p=>[`<b>${esc(p.name)}</b>`,`<span class=pill style="--c:${col(p.category)}">${esc(p.category)}</span>`,money(p.price),money(p.cost),`<span class=pill style="--c:${+p.stock<=+p.reorder_level?'#FF4D6D':'#2EE6A6'}">${p.stock}</span>`,`<button class=ghost onclick="prodForm('${p.id}')">Edit</button>`,`<button class="ghost" style="color:#FF6B81" onclick="del('${p.id}')">Delete</button>`]),'No products yet. Add your first one.');
 const q=$('#sq');q.oninput=()=>{const pos=q.selectionStart;stockView();const n=$('#sq');n.focus();n.setSelectionRange(pos,pos)}}
// The Add / Edit product dialog. TO ADD A PRODUCT FIELD: add it to the list F below, and to clean() and prod() in server.py.
function prodForm(id){
 const p={stock:0,reorder_level:10,...(P.find(x=>x.id==id)||{})};
 const F=[['name','Name'],['category','Category'],['barcode','Barcode (optional)'],['price','Selling price'],['cost','Cost price'],['stock','Stock on hand'],['reorder_level','Reorder at']];
 modal(`<h3>${id?'Edit product':'Add product'}</h3><div class=form>${F.map(([k,l])=>`<label>${l}<input name=${k} value="${esc(p[k])}" ${k=='category'?'list=cats':''}></label>`).join('')}</div><datalist id=cats>${[...new Set(P.map(x=>x.category))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <div class=acts><button class=ghost onclick=closeModal()>Cancel</button><button id=sv>Save product</button></div>`);
 $('#sv').onclick=async()=>{const d={};document.querySelectorAll('.form input').forEach(i=>d[i.name]=i.value);
  try{await api(id?'products/'+id:'products',id?'PUT':'POST',d);closeModal();toast(id?'Product updated':'Product added');P=await api('products');stockView()}catch(x){toast(x.message,1)}}}
// Deletes a product after asking to confirm. Past sales keep their own copy of the product's details.
async function del(id){const p=P.find(x=>x.id==id);if(!confirm(`Delete ${p.name}? Its sales history stays in the records.`))return;
 try{await api('products/'+id,'DELETE');toast('Product deleted');P=await api('products');stockView()}catch(x){toast(x.message,1)}}

// START-UP (the last line): if a sign-in token is remembered, check it and show the right screen; otherwise show the login screen.
(async()=>{if(!T)return loginView();try{ME=await api('me');route()}catch{loginView()}})();
</script></body></html>
