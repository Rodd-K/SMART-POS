name: Build SmartPOS Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - windows-packaging

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout SmartPOS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview==6.2.1 pythonnet pyinstaller

      - name: Build backend executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name SmartPOS_Server --add-data "index.html;." server.py

      - name: Build desktop executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SmartPOS --hidden-import=webview.platforms.edgechromium --hidden-import=clr --hidden-import=clr_loader --collect-all webview desktop_windows.py

      - name: Download offline WebView2 runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "dist/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build SmartPOS installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/SmartPOS.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SmartPOS-Windows-x64-Installer
          path: release/SmartPOS-Setup-x64.exe
          if-no-files-found: error
